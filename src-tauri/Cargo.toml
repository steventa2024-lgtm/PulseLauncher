[package]
name = "pulselauncher"
version = "0.1.0"
description = "PulseLauncher by ZeroPulse - free, open-source, local-first Windows launcher"
authors = ["ZeroPulse"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pulselauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-notification = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2.5"
pelite = "0.10"
dirs = "7"
walkdir = "2.5"
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["json"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
